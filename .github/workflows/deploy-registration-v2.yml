name: Deploy registration v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "registration-service/**"
      - ".github/workflows/deploy-registration-v2.yml"

permissions:
  contents: read

concurrency:
  group: census-registration-v2-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registration-service
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: registration-service/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx --yes vercel@58.4.4 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx --yes vercel@58.4.4 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx --yes vercel@58.4.4 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
# Census carries its immutable trait vocabulary onchain. Favor deployable bytecode
# margin over marginal hot-path gas savings; mint remains testnet gas-only.
optimizer_runs = 1
via_ir = true
# Read-only access to the frozen cross-language golden vectors shared with the Python
# pipeline tests. Scoped to the fixtures directory; no write access is granted.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fmt]
line_length = 120
